    configuration:
      retentionInBytes: 2147483648
  - name: june-july-25
    configuration:
      partitions: 8
      retentionInBytes: 2147483648
  - name: july-25
    configuration:
      retentionInBytes: 2147483648
  - name: aug-25
    configuration:
