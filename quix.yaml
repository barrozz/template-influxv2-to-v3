# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: InfluxDB v3 Sink
    application: influxdb_v3_sink
    version: e0fbf9efeacbd90f4ffc3d31d4da5978ae662138
    deploymentType: Service
    resources:
      cpu: 2000
      memory: 8000
      replicas: 1
    variables:
      - name: INPUT_TOPIC
        inputType: InputTopic
        description: The input topic from which to consume the InfluxDB v2 data
        value: aug-25
      - name: INFLUXDB_HOST
        inputType: FreeText
        description: The address of the InfluxDB v3 instance
        required: true
        value: https://us-east-1-1.aws.cloud2.influxdata.com
      - name: INFLUXDB_ORG
        inputType: FreeText
        description: The configured organization in the InfluxDB v3 instance
        required: true
        value: dev
      - name: INFLUXDB_BUCKET
        inputType: FreeText
        description: The name of the InfluxDB v3 bucket to store the synced data
        value: logs
      - name: INFLUXDB_TOKEN
        inputType: Secret
        description: The configured API Token to access the InfluxDB v3 instance (defined as a secret in Quix)
        required: true
        secretKey: INFLUXDB_V3_TOKEN
      - name: INFLUXDB_TAG_KEYS
        inputType: FreeText
        description: A list of tags to select when when writing the data to InfluxDB v3 (all others will be ignored)
        value: '["entity_id","entity_index","entity_name","id","line","name","sensor_name","serial","switch_name","type"]'
      - name: INFLUXDB_FIELD_KEYS
        inputType: FreeText
        description: A list of fields to select when when writing the data to InfluxDB v3 (all others will be ignored)
        required: true
        value: '["flow","flow_avg","flow_max","flow_min","flow_sp","index","latch_position","position","pressure_p1","pressure_p1_avg","pressure_p1_max","pressure_p1_min","pressure_p2","pressure_p2_avg","pressure_p2_max","pressure_p2_min","pressure_sp","v1_cycles","v2_cycles","v_bat","value","value_avg","value_curr","value_max","value_min","valve_position","volume","water_level","water_level_avg","water_level_max","water_level_min"]'
  - name: influxdb-2.0-source-june-july-25
    application: influxdb-2.0-source-sep-nov-25
    version: 9bdf0d6ac34122966525db333b894c7372a99b36
    deploymentType: Service
    resources:
      cpu: 2000
      memory: 8000
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: This is the Kafka topic that will receive the query results
        required: true
        value: june-july-25
      - name: task_interval
        inputType: FreeText
        description: Interval to run query. Must be within the InfluxDB notation; 1s, 1m, 1h, 1d, 1w, 1y
        required: true
        value: 5m
      - name: INFLUXDB_HOST
        inputType: FreeText
        description: Host address for the InfluxDB instance.
        required: true
        value: https://influx.bermad.io
      - name: INFLUXDB_TOKEN
        inputType: FreeText
        description: Authentication token to access InfluxDB.
        required: true
        value: Zk8O3hxhwnWY7sHbmGKs0lnS2WP6zVPGVk7N57khyNoJ3PPIIOoaWmISLCIHD5edYaFEdkTZFtfikDojvd5b1Q==
      - name: INFLUXDB_ORG
        inputType: FreeText
        description: Organization name in InfluxDB.
        required: true
        value: primary
      - name: INFLUXDB_BUCKET
        inputType: FreeText
        description: Bucket name in InfluxDB where data is stored.
        required: true
        value: logs
      - name: INFLUXDB_MEASUREMENT_NAME
        inputType: FreeText
        description: The InfluxDB measurement to read data from. If not specified, the name of the output topic will be used
        value: <INSERT MEASUREMENT>
  - name: InfluxDB v3 Sink july-25
