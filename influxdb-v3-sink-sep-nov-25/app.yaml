name: InfluxDB v3 Sink SEP-NOV-25
language: python
variables:
  - name: INPUT_TOPIC
    inputType: InputTopic
    multiline: false
    description: The input topic from which to consume the InfluxDB v2 data
    defaultValue: influxdbv2-data
  - name: INFLUXDB_HOST
    inputType: FreeText
    multiline: false
    description: The address of the InfluxDB v3 instance
    defaultValue: https://us-east-1-1.aws.cloud2.influxdata.com
    required: true
  - name: INFLUXDB_ORG
    inputType: FreeText
    multiline: false
    description: The configured organization in the InfluxDB v3 instance
    defaultValue: dev
    required: true
  - name: INFLUXDB_BUCKET
    inputType: FreeText
    multiline: false
    description: The name of the InfluxDB v3 bucket to store the synced data
    defaultValue: logs
  - name: INFLUXDB_TOKEN
    inputType: Secret
    multiline: false
    description: The configured API Token to access the InfluxDB v3 instance (defined as a secret in Quix)
    defaultValue: INFLUXDB_V3_TOKEN
    required: true
  - name: INFLUXDB_TAG_KEYS
    inputType: FreeText
    multiline: false
    description: A list of tags to select when when writing the data to InfluxDB v3 (all others will be ignored)
    defaultValue: '["entity_id","entity_index","entity_name","id","line","name","sensor_name","serial","switch_name","type"]'
  - name: INFLUXDB_FIELD_KEYS
    inputType: FreeText
    multiline: false
    description: A list of fields to select when when writing the data to InfluxDB v3 (all others will be ignored)
    defaultValue: '["flow","flow_avg","flow_max","flow_min","flow_sp","index","latch_position","position","pressure_p1","pressure_p1_avg","pressure_p1_max","pressure_p1_min","pressure_p2","pressure_p2_avg","pressure_p2_max","pressure_p2_min","pressure_sp","v1_cycles","v2_cycles","v_bat","value","value_avg","value_curr","value_max","value_min","valve_position","volume","water_level","water_level_avg","water_level_max","water_level_min"]'
    required: true
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
